name: Build Hamster DX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout official FingerTech project
        uses: actions/checkout@v4
        with:
          repository: FingerTechBR/FingertechHamster-AndroidAPP-
          ref: master
          path: fingertech
          persist-credentials: false

      - name: Install JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 28 and Build Tools 29 using preinstalled SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-28' 'build-tools;29.0.0'

      - name: Set up JDK 8 for legacy build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Patch legacy sample for demonstration build
        shell: bash
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' fingertech/build.gradle
          CRED='fingertech/app/src/main/java/com/fingertech/fingertechcapture/Utils/JavaMail/login_e_senha.java'
          if [ ! -f "$CRED" ]; then
            cat > "$CRED" <<'JAVA'
          package com.fingertech.fingertechcapture.Utils.JavaMail;
          // Empty credentials: demo app is not configured to send emails.
          public final class login_e_senha {
              public static final String login = "";
              public static final String senha = "";
              private login_e_senha() {}
          }
          JAVA
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fingertech/app/src/main/AndroidManifest.xml')
          x = p.read_text()
          x = x.replace('<uses-permission android:name="android.permission.INTERNET" />', '')
          x = x.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          x = x.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          x = x.replace('<activity android:name=".Cadastro">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>', '<activity android:name=".Cadastro" />')
          x = x.replace('<activity\n            android:name=".MainActivity"', '<activity\n            android:name=".MainActivity"')
          x = x.replace('android:windowSoftInputMode="adjustResize|stateAlwaysHidden">', 'android:windowSoftInputMode="adjustResize|stateAlwaysHidden">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>')
          p.write_text(x)
          PY
          # Fix initial fragment startup: NavHost inflates HomeFragment during
          # setContentView, before the sample constructs MainActivity.nitgen.
          # The fragment dereferences a null SDK instance and the app closes.
          python3 - <<'PY'
          from pathlib import Path
          main = Path('fingertech/app/src/main/java/com/fingertech/fingertechcapture/MainActivity.java')
          src = main.read_text()
          old = '        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);'
          new = '''        super.onCreate(savedInstanceState);
                  // Initialize before inflating the NavHostFragment and HomeFragment.
                  try {
                      nitgen = new Nitgen(this, this);
                      sdkStartupError = null;
                  } catch (Throwable error) {
                      nitgen = null;
                      sdkStartupError = error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage());
                      android.util.Log.e("HamsterDX", "Could not initialize SDK", error);
                  }
                  setContentView(R.layout.activity_main);'''
          assert old in src, 'MainActivity lifecycle anchor missing'
          src = src.replace(old, new, 1)
          old = '        this.nitgen = new Nitgen(this, this);'
          assert old in src, 'Late SDK initialization anchor missing'
          src = src.replace(old, '', 1)
          old = '    public static Nitgen nitgen;'
          assert old in src, 'SDK field anchor missing'
          src = src.replace(old, old + '\n    public static String sdkStartupError;', 1)
          main.write_text(src)

          home = Path('fingertech/app/src/main/java/com/fingertech/fingertechcapture/ui/home/HomeFragment.java')
          src = home.read_text()
          old = '''        nitgen = MainActivity.nitgen;
                  nitgen.setView(this);
                  if(!status) {'''
          new = '''        nitgen = MainActivity.nitgen;
                  if (nitgen == null) {
                      txt_sdk_verssao.setText("Falha ao iniciar SDK: " + MainActivity.sdkStartupError);
                      for (Button b : botoesenables) b.setEnabled(false);
                      btn_iniciar_dispositivo.setEnabled(false);
                  } else {
                      nitgen.setView(this);
                  }
                  if(nitgen != null && !status) {'''
          assert old in src, 'HomeFragment SDK access anchor missing'
          src = src.replace(old, new, 1)
          src = src.replace('''        }else{
                    btn_iniciar_dispositivo.setText("Fechar Dispositivo");
                }
                solicita_permissao''','''        }else if(nitgen != null){
                    btn_iniciar_dispositivo.setText("Fechar Dispositivo");
                }
                solicita_permissao''',1)
          home.write_text(src)
          PY
          APP_GRADLE='fingertech/app/build.gradle'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fingertech/app/build.gradle')
          x = p.read_text()
          x = x.replace('android {', 'android {\n    packagingOptions {\n        doNotStrip "**/*.so"\n    }', 1)
          x += '\n// Old Android Gradle Plugin cannot locate modern NDK strip binary.\ntasks.whenTaskAdded { task ->\n    if (task.name == "stripDebugDebugSymbols") task.enabled = false\n}\n'
          p.write_text(x)
          PY
          chmod +x fingertech/gradlew

      - name: Package FingerTech native libraries from vendor AAR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          aar = Path('fingertech/NBioBSPJNI_v2.0.0.3(11)/NBioBSPJNI_v2.0.0.3(11).aar')
          output = Path('fingertech/app/src/main/jniLibs')
          with ZipFile(aar) as archive:
              libraries = [name for name in archive.namelist()
                           if name.startswith('jni/') and name.endswith('.so')]
              print('Vendor AAR native libraries:', libraries)
              if not libraries:
                  raise SystemExit('ERROR: Vendor AAR does not contain any jni/*.so libraries')
              for entry in libraries:
                  parts = Path(entry).parts
                  assert len(parts) == 3 and parts[0] == 'jni'
                  dest = output / parts[1] / parts[2]
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.read(entry))
          names = [p.name for p in output.rglob('*.so')]
          if 'libnative-lib.so' not in names:
              raise SystemExit('ERROR: libnative-lib.so not found in vendor AAR')
          print('Packaged native ABI libraries:', [(p.parent.name, p.name) for p in output.rglob('*.so')])
          PY

      - name: Build unsigned debug APK
        working-directory: fingertech
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Inject missing JNI libraries and re-sign debug APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          src = next(Path('fingertech/app/build/outputs/apk/debug').glob('*.apk'))
          original = src.with_suffix('.unsigned.apk')
          aar = Path('fingertech/NBioBSPJNI_v2.0.0.3(11)/NBioBSPJNI_v2.0.0.3(11).aar')
          supported = {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}
          with ZipFile(src) as app, ZipFile(original, 'w') as dest, ZipFile(aar) as vendor:
              for item in app.infolist():
                  # Discard previous signature (we sign the final file below).
                  if item.filename.startswith('META-INF/') and item.filename.endswith(('.RSA', '.SF', '.MF', '.DSA', '.EC')):
                      continue
                  dest.writestr(item, app.read(item.filename))
              for item in vendor.infolist():
                  parts = Path(item.filename).parts
                  if len(parts) == 3 and parts[0] == 'jni' and parts[1] in supported and parts[2].endswith('.so'):
                      name = 'lib/' + '/'.join(parts[1:])
                      dest.writestr(name, vendor.read(item.filename), compress_type=ZIP_STORED)
                      print('Added:', name)
          PY
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/29.0.0"
          APK="fingertech/app/build/outputs/apk/debug/app-debug.apk"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 "fingertech/app/build/outputs/apk/debug/app-debug.unsigned.apk" "fingertech/app/build/outputs/apk/debug/app-debug.aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$APK" "fingertech/app/build/outputs/apk/debug/app-debug.aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          rm -f "fingertech/app/build/outputs/apk/debug/app-debug.unsigned.apk" "fingertech/app/build/outputs/apk/debug/app-debug.aligned.apk"

      - name: Verify native libraries exist in generated APK
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = next(Path('fingertech/app/build/outputs/apk/debug').glob('*.apk'))
          with ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          print('APK native libraries:', libs)
          assert any(n.endswith('/libnative-lib.so') for n in libs), 'APK missing libnative-lib.so'
          PY

      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-DX-Android-v3-NativeSDK-signed
          path: fingertech/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
